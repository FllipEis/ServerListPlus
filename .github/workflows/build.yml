name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 for <= 1.21.11, 25 for 26.1+ (last one is the default JAVA_HOME)
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      # Fails when the sources were committed while another version was active in Stonecutter
      - name: Check that sources are on the VCS version
        run: |
          ./gradlew "Reset active project" --console=plain
          git diff --exit-code

      - name: Build all versions and run tests
        run: ./gradlew buildAndCollect :core:test --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: serverlistplus-jars
          path: build/libs/
          if-no-files-found: error

  # Starts the game without a window and clicks through the screens (src/gametest)
  client-game-test:
    runs-on: ubuntu-24.04
    # A game that cannot start hangs instead of exiting
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Software Vulkan for the windowless game, as Fabric API's own client tests use it.
      # An X virtual display does not work: 26.x finds no matching GLX visual there.
      - name: Install software graphics drivers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Run client game tests
        run: ./gradlew :26.3-fabric:runClientGameTest --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-game-test-screenshots
          path: versions/26.3-fabric/build/run/clientGameTest/screenshots/
          if-no-files-found: ignore
