name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: "26.3"
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options: [Fabric, NeoForge]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ServerListPlus version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Other mods that change menus or the server list are the most interesting.
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: Paste `logs/latest.log` or the file from `crash-reports/`, or a link to it.
      render: text
